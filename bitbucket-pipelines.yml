image: node:20

pipelines:
  branches:
    main:
      - step:
          name: Build and Push Next.js Web (AMD64)
          services:
            - docker
          script:
            # 1. Login ke Docker Hub Registry
            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            
            # 2. Build Docker Image (Gunakan nama image underscore 'julu_web')
            # Catatan: tambahkan --build-arg jika Anda menerapkan langkah suntikan URL API di atas
            - docker build -t $DOCKERHUB_USERNAME/julu_web:latest .
            
            # 3. Push ke Docker Hub
            - docker push $DOCKERHUB_USERNAME/julu_web:latest
            
      - step:
          name: Deployment Web to VPS
          script:
            # 4. Remote Execution ke Jalur /root/julu-stack menembak service 'julu-web'
            - ssh -p 22 root@139.59.108.251 "
                cd /root/julu-stack &&
                echo '$DOCKERHUB_PASSWORD' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin &&
                docker compose pull julu-web &&
                docker compose up -d --no-deps julu-web &&
                docker image prune -f
              "