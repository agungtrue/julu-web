version: '3.8'

services:
  julu-web:
    image: agungtrue/julu_web:local
    container_name: julu_web
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=local
      - PORT=3008 
      - HOSTNAME=0.0.0.0
    # - NEXT_PUBLIC_API_URL=https://api.domainanda.com

  nginx:
    image: nginx:alpine
    container_name: julu_nginx_local
    restart: always
    ports:
      - "80:80"   # HTTP
      # - "443:443" # HTTPS
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - julu-web